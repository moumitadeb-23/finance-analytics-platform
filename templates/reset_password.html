<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Reset Password | Finance Analytics Platform</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/login.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="bg-shape shape1"></div>
<div class="bg-shape shape2"></div>
<div class="bg-shape shape3"></div>

<div class="login-container">

    <!-- LEFT -->

    <div class="left">

        <div class="brand">

            <h1>🔒</h1>

            <h2>Create New Password</h2>

            <p>Finance Analytics Platform</p>

        </div>

        <h3>Security First</h3>

        <p>

            Choose a strong password containing uppercase,

            lowercase, numbers and special characters.

        </p>

    </div>

    <!-- RIGHT -->

    <div class="right glass-panel">

        <form method="POST">

            <h2>Reset Password</h2>

            <p style="margin-bottom:25px;color:#666;text-align:center;">

                Enter your new password

            </p>

            {% if error %}

            <div class="alert-error">

                {{ error }}

            </div>

            {% endif %}

            <div class="input-box password-box">

                <input
                type="password"
                id="password"
                name="password"
                required>

                <label>🔒 New Password</label>

                <i
                class="fa-solid fa-eye"
                id="togglePassword"></i>

            </div>

            <div class="input-box password-box">

                <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                required>

                <label>🔒 Confirm Password</label>

            </div>

            <button type="submit">

                Update Password

            </button>

            <p class="register-link">

                <a href="{{ url_for('login') }}">

                    Back to Login

                </a>

            </p>

        </form>

    </div>

</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>

</html>

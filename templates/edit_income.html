{% extends "base.html" %}

{% block title %}
Edit Income
{% endblock %}

{% block content %}

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-7">

<div class="card shadow-lg border-0">

<div class="card-header bg-primary text-white">

<h3>

✏ Edit Income

</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>

Income Source

</label>

<input

type="text"

class="form-control"

name="source"

value="{{ income[2] }}"

required>

</div>

<div class="mb-3">

<label>

Amount

</label>

<input

type="number"

class="form-control"

name="amount"

value="{{ income[3] }}"

required>

</div>

<div class="mb-3">

<label>

Date

</label>

<input

type="date"

class="form-control"

name="date"

value="{{ income[4] }}"

required>

</div>

<div class="d-flex justify-content-between">

<a

href="/income_list"

class="btn btn-secondary">

⬅ Back

</a>

<button

class="btn btn-success"

type="submit">

💾 Update Income

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}

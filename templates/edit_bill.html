{% extends "base.html" %}

{% block title %}Edit Bill{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/bills.css') }}">
{% endblock %}

{% block content %}

<div class="bills-dashboard">

    <div class="card">

        <div class="card-header">
            <h2>
                <i class="fas fa-edit"></i>
                Edit Bill
            </h2>
        </div>

        <form action="{{ url_for('update_bill', id=bill.id) }}" method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Bill Name</label>
                    <input
                        type="text"
                        name="bill_name"
                        value="{{ bill.bill_name }}"
                        required>
                </div>

                <div class="form-group">
                    <label>Category</label>

                    <input
                        type="text"
                        name="category"
                        value="{{ bill.category }}">
                </div>

                <div class="form-group">
                    <label>Amount</label>

                    <input
                        type="number"
                        name="amount"
                        value="{{ bill.amount }}"
                        required>
                </div>

                <div class="form-group">
                    <label>Due Date</label>

                    <input
                        type="date"
                        name="due_date"
                        value="{{ bill.due_date }}"
                        required>
                </div>

                <div class="form-group">
                    <label>Frequency</label>

                    <input
                        type="text"
                        name="frequency"
                        value="{{ bill.frequency }}">
                </div>

                <div class="form-group">
                    <label>Reminder Days</label>

                    <input
                        type="number"
                        name="reminder_days"
                        value="{{ bill.reminder_days }}">
                </div>

            </div>

            <div class="form-group">

                <label>Notes</label>

                <textarea
                    name="notes"
                    rows="4">{{ bill.notes }}</textarea>

            </div>

            <button class="btn-primary">

                <i class="fas fa-save"></i>

                Update Bill

            </button>

        </form>

    </div>

</div>

{% endblock %}

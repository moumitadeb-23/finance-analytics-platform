{% extends "base.html" %}

{% block content %}

<h2>User Feedback</h2>

<table class="table">

<tr>

<th>User</th>

<th>Rating</th>

<th>Experience</th>

<th>Feedback</th>

<th>Email</th>

<th>Date</th>

</tr>

{% for f in feedbacks %}

<tr>

<td>{{f.name}}</td>

<td>{{f.rating}} ⭐</td>

<td>{{f.experience}}</td>

<td>{{f.feedback}}</td>

<td>{{f.email}}</td>

<td>{{f.created_at}}</td>

</tr>

{% endfor %}

</table>

{% endblock %}

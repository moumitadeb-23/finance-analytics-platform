<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Finance Analytics Platform</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="bg-shape shape1"></div>
<div class="bg-shape shape2"></div>
<div class="bg-shape shape3"></div>

<div class="login-container">

    <!-- Left Panel -->

    <div class="left">

        <div class="brand">

            <h1>💰</h1>

            <h2>Finance Analytics Platform for Financial Reporting and Budget Tracking</h2>

            <p>Track • Save • Grow</p>

        </div>

        <h3>Welcome Back 👋</h3>

        <p>

            Login to continue managing your finances securely with AI-powered insights.

        </p>

    </div>

    <!-- Right Panel -->

    <div class="right glass-panel">

        <form method="POST" id="loginForm" autocomplete="on">

            <h2>Login</h2>

            {% if error %}

            <div class="alert-error">

            {{ error }}

            </div>

            {% endif %}

            <!-- Email -->

            <div class="input-box">

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required>

                <label for="email">
                    📧 Email Address
                </label>

            </div>

            <!-- Password -->

            <div class="input-box password-box">

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required>

                <label for="password">
                    🔒 Password
                </label>

                <i
                    class="fa-solid fa-eye"
                    id="togglePassword">
                </i>

            </div>

            <!-- Remember Me -->

            <div class="remember">

                <label class="remember-label">

                    <input
                        type="checkbox"
                        name="remember"
                        id="remember">

                    <span class="checkmark"></span>

                    Remember Me

                </label>

                <a href="{{ url_for('forgot_password') }}">
                    Forgot Password?
                </a>

            </div>

            <!-- Button -->

            <button
                type="submit"
                id="loginBtn">

                Login

            </button>

            <p class="register-link">

                Don't have an account?

                <a href="/register"
                   class="page-transition">

                    Register Here

                </a>

            </p>

        </form>

    </div>

</div>


<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>

</html>
